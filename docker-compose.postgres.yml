services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: scamshield
      POSTGRES_DB: scamshield
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scamshield -d scamshield"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  backend:
    environment:
      DATABASE_URL: postgresql+psycopg://scamshield:${POSTGRES_PASSWORD}@db:5432/scamshield
    depends_on:
      db:
        condition: service_healthy
  telegram:
    environment:
      DATABASE_URL: postgresql+psycopg://scamshield:${POSTGRES_PASSWORD}@db:5432/scamshield
  retention:
    environment:
      DATABASE_URL: postgresql+psycopg://scamshield:${POSTGRES_PASSWORD}@db:5432/scamshield
volumes:
  postgres:
